<title>SllizGeo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body[data-theme=dark]{--bg:#121417;--card:#1d2127;--text:#eceff4;--acc:#4ea1ff;--ok:#2ecc71;--bad:#e74c3c;--line:#2d333b;--glow:none}
body[data-theme=neon]{--bg:#0a0014;--card:#17002b;--text:#e6fff9;--acc:#00ffd5;--ok:#39ff14;--bad:#ff2d75;--line:#6a00b8;--glow:0 0 10px #00ffd566}
body[data-theme=light]{--bg:#f2f5f9;--card:#ffffff;--text:#1b1f24;--acc:#1e6fe0;--ok:#1fa653;--bad:#d63a2f;--line:#d5dbe3;--glow:none}
#app{max-width:520px;margin:0 auto;padding:10px 12px 30px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.stats{display:flex;gap:12px;font-size:15px}
.hbtns{display:flex;gap:8px}
button{font:inherit;color:var(--text);cursor:pointer}
.ib{background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:20px;padding:6px 12px;box-shadow:var(--glow)}
h1{text-align:center;margin:6px 0 2px;font-size:30px;color:var(--acc);letter-spacing:1px}
.sub{text-align:center;font-size:12px;opacity:.7;margin-bottom:14px}
.menu button.mode{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;font-size:17px;box-shadow:var(--glow)}
.mode .ic{font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;text-align:center;box-shadow:var(--glow)}
.q{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.qt{font-size:26px;font-weight:700}
.qs{font-size:14px;opacity:.8}
.fe{font-size:96px;line-height:1.1}
.fb{display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px dashed var(--acc);border-radius:10px;font-weight:700;color:var(--acc);padding:14px 22px;font-size:26px}
.flag svg{width:150px;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
.grid .flag svg{width:100%}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 10px;font-size:17px;min-height:56px;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow)}
.opt .fe{font-size:56px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,var(--card))}
.opt.hide{visibility:hidden}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px}
.bar{height:6px;background:var(--line);border-radius:4px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.hints{display:flex;gap:10px;margin-top:12px}
.hints button,.btn{flex:1;background:var(--card);border:1px solid var(--acc);color:var(--acc);border-radius:12px;padding:12px;font-size:15px}
.btn.pri{background:var(--acc);color:#fff}
.map{width:200px;height:200px}
.map polygon{fill:var(--acc);stroke:var(--text);stroke-width:1;stroke-linejoin:round}
.facts{text-align:left;font-size:18px;line-height:1.8}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modal.hidden{display:none}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;border:1px solid var(--line)}
.sheet h2{margin:0 0 10px}
.sec{margin:14px 0 6px;font-weight:700;color:var(--acc)}
label.row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:16px}
label.row input{width:20px;height:20px;accent-color:var(--acc)}
.small{font-size:12px;opacity:.7;margin-top:6px}
.shopi{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.shopi button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px}
.shopi button.off{background:var(--line);color:var(--text)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 18px;border-radius:20px;z-index:20;opacity:0;transition:.3s;pointer-events:none;font-size:15px}
#toast.show{opacity:1}
.res{font-size:18px;line-height:1.9}
.big{font-size:44px}
</style>

 XA:()=>stripes(["#1f9a3b","#fff","#1f9a3b","#fff","#1f9a3b","#fff","#1f9a3b"],[1,1,1,1,1,1,1])+<rect width="11" height="10" fill="#d6202a"/><circle cx="5.5" cy="5" r="2" fill="#fff"/>,
 XC:()=><rect width="30" height="20" fill="#fff"/><rect y="2.5" width="30" height="2" fill="#d6202a"/><rect y="15.5" width="30" height="2" fill="#d6202a"/><circle cx="15" cy="10" r="4" fill="#d6202a"/><circle cx="16.3" cy="10" r="3.3" fill="#fff"/><circle cx="18" cy="10" r="1" fill="#d6202a"/>
};
let FLAGOK=true;
(function(){try{const c=document.createElement("canvas");c.width=c.height=48;const x=c.getContext("2d");x.font="32px sans-serif";x.fillText("\u{1F1E9}\u{1F1EA}",0,36);const d=x.getImageData(0,0,48,48).data;let red=false;for(let i=0;i<d.length;i+=4){if(d[i]>180&&d[i+1]<60&&d[i+2]<60&&d[i+3]>200){red=true;break}}FLAGOK=red}catch(e){}})();
function emoji(code){return String.fromCodePoint(...[...code].map(ch=>0x1F1E6+ch.charCodeAt(0)-65))}
function flagHTML(c){
  if(CUSTOM[c.code])return <div class="flag"><svg viewBox="0 0 30 20">${CUSTOM[c.code]()}</svg></div>;
  if(FLAGOK)return <div class="fe">${emoji(c.code)}</div>;
  return <div class="fb">${c.code}</div>;
}

/* ================= СОХРАНЕНИЯ ================= */
const KEY="sllizgeo_v1";
const DEF={coins:0,score:0,best:0,theme:"dark",themes:["dark"],hints:{fifty:1,skip:1},settings:{conts:ALLCONT.slice(),onlyUN:false,onlyMain:false,count:"max"}};

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));
    if(d)return Object.assign({},DEF,d,{settings:Object.assign({},DEF.settings,d.settings{}),hints:Object.assign({},DEF.hints,d.hints{})});
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function upd(){$("hc").textContent=S.coins;$("hs").textContent=S.score;document.body.dataset.theme=S.theme}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){const s=S.settings;return DB.filter(c=>s.conts.includes(c.continent)&&(!s.onlyUNc.isUN)&&(!s.onlyMainc.isMainland))}
function fmtPop(m){if(m>=1)return "≈ "+(m>=10?Math.round(m):m)+" млн";return "≈ "+Math.round(m*1e6).toLocaleString("ru")+" чел."}

/* ================= РЕЖИМЫ ================= */
const MODES={
 flag:{icon:"🏳️",title:"Угадай страну по флагу",q:(c)=>${flagHTML(c)}<div class="qs">Какой стране принадлежит этот флаг?</div>,o:(o)=>o.name,label:o=>o.name},
 flagrev:{icon:"🎌",title:"Угадай флаг по стране",grid:true,q:(c)=><div class="qt">${c.name}</div><div class="qs">Выберите правильный флаг</div>,o:(o)=>flagHTML(o),label:o=>o.code},
 capital:{icon:"🏛️",title:"Столицы",dir:true,
   q:(c,d)=>d?<div class="qt">${c.name}</div><div class="qs">Какая столица у этой страны?</div>:<div class="qt">${c.capital}</div><div class="qs">Столица какой страны?</div>,
   o:(o,d)=>d?o.capital:o.name,label:(o,d)=>d?o.capital:o.name},
 food:{icon:"🍲",title:"Национальные блюда",q:(c)=><div class="qt">🍽️ ${c.food.name}</div><div class="qs">${c.food.desc}</div><div class="qs">Из какой страны это блюдо?</div>,o:o=>o.name,label:o=>o.name},
 map:{icon:"🗺️",title:"Контуры карт",ok:c=>!!c.mapSvg,q:(c)=>${c.mapSvg}<div class="qs">Какая страна изображена? (упрощённый контур)</div>,o:o=>o.name,label:o=>o.name},
 stats:{icon:"📊",title:"Население и Статистика",q:(c)=><div class="facts">👥 Население: <b>${fmtPop(c.population)}</b><br>🏘️ Областей/субъектов: <b>${c.regionsCount}</b><br>🏙️ Городов-миллионников: <b>${c.millionCitiesCount}</b></div><div class="qs">Что это за страна?</div>,o:o=>o.name,label:o=>o.name},
 leader:{icon:"👤",title:"Лидеры и Президенты",q:(c)=><svg width="90" height="90" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="var(--bg)" stroke="var(--acc)" stroke-width="3"/><circle cx="50" cy="38" r="16" fill="var(--acc)"/><path d="M18 88c4-22 20-30 32-30s28 8 32 30" fill="var(--acc)"/></svg><div class="qt">${c.leader}</div><div class="qs">Лидер какой страны?</div>,o:o=>o.name,label:o=>o.name}
};
let G=null;

/* ================= МЕНЮ ================= */
function showMenu(){
  G=null;upd();
  const p=pool();
  $("view").innerHTML=<div class="menu"><h1>SllizGeo</h1><div class="sub">Доступно стран: ${p.length} из ${DB.length} · Рекорд раунда: ${S.best}</div>+
   Object.keys(MODES).map(k=><button class="mode" data-m="${k}"><span class="ic">${MODES[k].icon}</span>${MODES[k].title}</button>).join("")+</div>;
  document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>startGame(b.dataset.m));
}

/* ================= ИГРА ================= */
function startGame(key){
  const m=MODES[key];
  const p=pool().filter(c=>m.ok?m.ok(c):true);
  if(p.length<1){toast("Нет стран по этим фильтрам (⚙️)");return}
  const cnt=S.settings.count==="max"?p.length:Math.min(+S.settings.count,p.length);
  G={key,m,qs:shuffle(p).slice(0,cnt),i:0,correct:0,coins:0,pts:0,streak:0,locked:false,used50:false};
  nextQ();
}
function makeOpts(c,m,d){
  const used=new Set([m.label(c,d)]);const res=[c];

const add=list=>{for(const x of list){if(res.length>=4)break;if(x===c)continue;const l=m.label(x,d);if(used.has(l))continue;used.add(l);res.push(x)}};
  add(shuffle(pool()));
  if(res.length<4)add(shuffle(DB));
  return shuffle(res);
}
function nextQ(){
  if(G.i>=G.qs.length)return finish();
  const m=G.m,c=G.qs[G.i];
  G.dir=m.dir?Math.random()<.5:false;G.locked=false;G.used50=false;
  G.cur=c;G.opts=makeOpts(c,m,G.dir);
  const pct=Math.round(G.i/G.qs.length*100);
  $("view").innerHTML=<div class="top"><button class="ib" id="quit">←</button><span>${G.i+1} / ${G.qs.length}</span><span>🔥 ${G.streak}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card q">${m.q(c,G.dir)}</div>
  <div class="opts ${m.grid?"grid":""}">${G.opts.map((o,k)=><button class="opt" data-k="${k}">${m.o(o,G.dir)}</button>).join("")}</div>
  <div class="hints"><button id="h50">50/50 (${S.hints.fifty})</button><button id="hskip">Пропуск (${S.hints.skip})</button></div>;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("quit").onclick=()=>{if(confirm("Выйти из раунда? Прогресс раунда будет завершён."))finish()};
  $("h50").onclick=useFifty;$("hskip").onclick=useSkip;
}
function useFifty(){
  if(G.locked||G.used50)return;
  if(S.hints.fifty<=0){toast("Купите 50/50 в магазине 🛒");return}
  S.hints.fifty--;G.used50=true;save();
  const wrong=shuffle(G.opts.map((o,k)=>k).filter(k=>G.opts[k]!==G.cur)).slice(0,2);
  const bs=document.querySelectorAll(".opt");
  wrong.forEach(k=>{bs[k].classList.add("hide");bs[k].disabled=true});
  $("h50").textContent=50/50 (${S.hints.fifty});
}
function useSkip(){
  if(G.locked)return;
  if(S.hints.skip<=0){toast("Купите пропуск в магазине 🛒");return}
  S.hints.skip--;save();G.i++;nextQ();
}
function answer(k){
  if(G.locked)return;G.locked=true;
  const bs=document.querySelectorAll(".opt");
  const ok=G.opts[k]===G.cur;
  bs.forEach((b,i)=>{if(G.opts[i]===G.cur)b.classList.add("ok")});
  if(ok){
    const coins=5+Math.min(G.streak,5),pts=10+G.streak*2;
    G.streak++;G.correct++;G.coins+=coins;G.pts+=pts;S.coins+=coins;S.score+=pts;
    toast(+${coins} 🪙  +${pts} ⭐);
  }else{
    bs[k].classList.add("bad");G.streak=0;
    toast("Правильно: "+G.cur.name);
  }
  save();upd();
  setTimeout(()=>{if(!G)return;G.i++;nextQ()},ok?900:1700);
}
function finish(){
  const g=G;if(!g)return showMenu();
  if(g.pts>S.best)S.best=g.pts;save();upd();
  G=null;
  $("view").innerHTML=<div class="card"><div class="big">🏁</div><h2>Раунд завершён</h2>
  <div class="res">Режим: ${g.m.title}<br>Верных ответов: <b>${g.correct}</b> из ${g.qs.length}<br>Очки за раунд: <b>${g.pts}</b> ⭐<br>Монеты за раунд: <b>${g.coins}</b> 🪙</div></div>
  <div class="hints"><button class="btn pri" id="again">Ещё раз</button><button class="btn" id="tomenu">В меню</button></div>;
  $("again").onclick=()=>startGame(g.key);$("tomenu").onclick=showMenu;
}

/* ================= МОДАЛЬНЫЕ ОКНА ================= */
function openModal(html){$("sheet").innerHTML=html;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden");if(!G)showMenu()}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function openSettings(){
  const s=S.settings;
  openModal(<h2>⚙️ Настройки</h2>
  <div class="sec">Континенты</div>
  ${ALLCONT.map((c,i)=><label class="row"><input type="checkbox" class="cc" value="${c}" ${s.conts.includes(c)?"checked":""}>${c}</label>`).join("")}
  <div class="sec">Фильтры категорий</div>
  <label class="row"><input type="checkbox" id="fUN" ${s.onlyUN?"checked":""}>Только страны ООН</label>
  <label class="row"><input type="checkbox" id="fMain" ${s.onlyMain?"checked":""}>Только материковые страны</label>
  <div class="sec">Вопросов в раунде</div>

${["10","20","50","100","max"].map(v=><label class="row"><input type="radio" name="cnt" class="rc" value="${v}" ${String(s.count)===v?"checked":""}>${v==="max"?"Максимум":v}</label>).join("")}
  <div class="small" id="avail"></div>
  <div class="hints"><button class="btn pri" id="closeS">Готово</button></div>);
  const refresh=()=>{
    s.conts=[...document.querySelectorAll(".cc")].filter(x=>x.checked).map(x=>x.value);
    s.onlyUN=$("fUN").checked;s.onlyMain=$("fMain").checked;
    const r=document.querySelector(".rc:checked");s.count=r?r.value:"max";
    save();
    const n=pool().length;
    const rounds=s.count==="max"?n:Math.min(+s.count,n);
    $("avail").textContent=Доступно стран: ${n} из ${DB.length} · В раунде вопросов: ${rounds};
  };
  document.querySelectorAll(".cc,#fUN,#fMain,.rc").forEach(e=>e.onchange=refresh);
  $("closeS").onclick=closeModal;refresh();
}

const SHOP=[
 {id:"fifty",t:"💡 Подсказка 50/50",d:"Убирает 2 неверных ответа",price:30,type:"hint"},
 {id:"skip",t:"⏭️ Пропуск вопроса",d:"Пропустить без штрафа",price:20,type:"hint"},
 {id:"dark",t:"🌑 Тёмная тема",d:"Базовая",price:0,type:"theme"},
 {id:"neon",t:"🌈 Неоновая тема",d:"Яркие цвета и свечение",price:150,type:"theme"},
 {id:"light",t:"☀️ Светлая тема",d:"Для яркого дня",price:100,type:"theme"}
];
function openShop(){
  openModal(<h2>🛒 Магазин</h2><div class="small" style="margin-bottom:10px">Ваши монеты: <b>${S.coins}</b> 🪙</div>+
  SHOP.map(it=>{
    let btn;
    if(it.type==="hint"){btn=<button data-id="${it.id}">${it.price} 🪙</button>;}
    else if(S.themes.includes(it.id)){btn=S.theme===it.id?<button class="off" disabled>Активна</button>:<button data-id="${it.id}" data-apply="1">Применить</button>;}
    else btn=<button data-id="${it.id}">${it.price} 🪙</button>;
    const own=it.type==="hint"? (есть: ${S.hints[it.id]}):"";
    return <div class="shopi"><div><b>${it.t}</b>${own}<div class="small">${it.d}</div></div>${btn}</div>;
  }).join("")+<div class="hints"><button class="btn pri" id="closeSh">Закрыть</button></div>`);
  $("closeSh").onclick=closeModal;
  document.querySelectorAll(".shopi button[data-id]").forEach(b=>b.onclick=()=>{
    const it=SHOP.find(x=>x.id===b.dataset.id);
    if(b.dataset.apply){S.theme=it.id;save();upd();openShop();return}
    if(S.coins<it.price){toast("Не хватает монет 🪙");return}
    S.coins-=it.price;
    if(it.type==="hint")S.hints[it.id]++;else{S.themes.push(it.id);S.theme=it.id}
    save();upd();toast("Куплено!");openShop();
  });
}
$("bGear").onclick=openSettings;$("bShop").onclick=openShop;
